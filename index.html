<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-weight"></section>
    <section class="view" id="view-water"></section>
    <section class="view" id="view-spanish"></section>
    <section class="view" id="view-read"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span>Summary</span>
    </button>
    <button data-action="tab" data-tab="weight">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 9.5a4.6 4.6 0 0 1 8 0"/><path d="M12 9.6l1.4-2.2"/></svg>
      <span>Weight</span>
    </button>
    <button data-action="tab" data-tab="water">
      <svg viewBox="0 0 24 24"><path d="M12 2.8c3.4 4.3 6.4 7.8 6.4 11.4a6.4 6.4 0 0 1-12.8 0C5.6 10.6 8.6 7.1 12 2.8z"/></svg>
      <span>Water</span>
    </button>
    <button data-action="tab" data-tab="spanish">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 8h7M8.5 11.5h4.5"/></svg>
      <span>Español</span>
    </button>
    <button data-action="tab" data-tab="read">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10 4.8 7 4.3 3.5 4.6v13.6c3.5-.3 6.5.2 8.5 1.9 2-1.7 5-2.2 8.5-1.9V4.6C17 4.3 14 4.8 12 6.5z"/><path d="M12 6.5v13.6"/></svg>
      <span>Read</span>
    </button>
  </nav>

  <div id="reader" class="reader" aria-hidden="true"></div>
  <div id="sheet-root"></div>

  <script src="articles.js"></script>
  <script src="app.js"></script>
</body>
</html>
